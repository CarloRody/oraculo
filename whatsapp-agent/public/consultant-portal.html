<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Agenda | Oráculo</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0a1628;
        color: #e0e0e0;
        min-height: 100vh;
        padding: 1.25rem;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 {
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 1.6rem;
    }
    .subtitle { color: #64748b; margin-bottom: 1.25rem; font-size: 0.88rem; }
    .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.1rem;
        margin-bottom: 1.1rem;
    }
    .card h2 { font-size: 1rem; color: #f8fafc; margin-bottom: 0.8rem; }
    .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid #334155; flex-wrap: wrap; margin-bottom: 1.1rem; }
    .tab-btn {
        background: none; border: none; color: #94a3b8; font-size: 0.9rem;
        padding: 0.5rem 1rem; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #60a5fa; border-bottom-color: #60a5fa; }
    .tab-icon { display: none; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* Sub-abas da ficha do paciente (aba Pacientes) — classes próprias, não
       .tabs/.tab-btn, pra não herdar a conversão pra sidebar vertical do
       media query abaixo (essa é só pra #topTabs). Sempre abas horizontais
       normais, igual ao painel da secretária. */
    .subtabs { display: flex; gap: 0.5rem; border-bottom: 1px solid #334155; flex-wrap: wrap; margin-bottom: 1.1rem; }
    .subtab-btn {
        background: none; border: none; color: #94a3b8; font-size: 0.9rem;
        padding: 0.5rem 1rem; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .subtab-btn.active { color: #60a5fa; border-bottom-color: #60a5fa; }

    /* ---- Em telas largas (médico abrindo no desktop/notebook), a barra de
       abas vira uma sidebar fixa, igual aos demais painéis. No celular
       (a maioria dos acessos, vindos do link do WhatsApp) o layout continua
       idêntico ao de sempre — nada muda abaixo de 900px. ---- */
    @media (min-width: 900px) {
        body { padding: 0; }
        .wrap { display: flex; max-width: none; margin: 0; min-height: 100vh; align-items: stretch; }
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #0d1526;
            border-right: 1px solid #1a2744;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            align-self: flex-start;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-brand { padding: 1.5rem 1.25rem 1rem; border-bottom: 1px solid #1a2744; }
        .sidebar-brand h1 { font-size: 1.25rem; }
        .sidebar-brand .subtitle { font-size: 0.78rem; margin-bottom: 0; }
        .tabs { flex-direction: column; border-bottom: none; margin-bottom: 0; flex: 1; padding: 0.6rem 0; gap: 0; }
        .tab-btn {
            display: flex; align-items: center; gap: 0.7rem;
            width: 100%; text-align: left;
            border-left: 3px solid transparent; border-bottom: none;
            padding: 0.7rem 1.25rem;
        }
        .tab-btn:hover { background: #141f38; color: #cbd5e1; }
        .tab-btn.active { background: #16233d; border-left-color: #60a5fa; border-bottom-color: transparent; }
        .tab-icon { display: inline-block; font-size: 1.05rem; width: 1.3rem; text-align: center; flex-shrink: 0; }
        .main-content { flex: 1; min-width: 0; padding: 1.5rem 2rem; }
    }
    .empty { color: #64748b; font-size: 0.85rem; padding: 0.5rem 0; }
    .appt-id-badge {
        display: inline-block;
        font-family: monospace;
        font-weight: 700;
        font-size: 0.78rem;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 5px;
        padding: 0.1rem 0.4rem;
        margin-right: 0.35rem;
    }
    .appt-row {
        display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
        padding: 0.7rem 0; border-bottom: 1px solid #1a2744;
    }
    .appt-row:last-child { border-bottom: none; }
    .appt-info .name { font-weight: 600; color: #f8fafc; font-size: 0.92rem; }
    .appt-info .when { color: #94a3b8; font-size: 0.8rem; margin-top: 0.1rem; }
    .appt-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .status-badge {
        display: inline-block; padding: 0.15rem 0.55rem; border-radius: 10px;
        font-size: 0.72rem; font-weight: 600; margin-left: 0.4rem;
    }
    .status-confirmed { background: #1f4a2d; color: #4ade80; }
    .status-cancelled { background: #4a1f27; color: #f87171; }
    .status-completed { background: #1a2744; color: #94a3b8; }
    .status-no_show { background: #4a3a1f; color: #fbbf24; }
    .status-pending_consultant { background: #4a3a1f; color: #fbbf24; }
    .btn {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border: none; border-radius: 6px; color: #fff;
        padding: 0.45rem 0.9rem; font-size: 0.82rem; cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:hover { opacity: 0.4; }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.76rem; }
    .btn-danger { background: #ef4444; }
    .btn-secondary { background: #334155; }
    .btn-block { width: 100%; margin-top: 0.5rem; }
    .form-group { margin-bottom: 0.8rem; }
    .form-group label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 0.3rem; }
    .form-input {
        width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
        padding: 0.55rem 0.7rem; color: #e0e0e0; font-size: 0.88rem;
    }
    .day-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
    .day-row label { width: 60px; font-size: 0.82rem; color: #cbd5e1; display: flex; align-items: center; gap: 0.3rem; margin: 0; }
    .day-row input[type=time] { width: auto; flex: 1; }
    .slot-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .slot-btn {
        background: #0f172a; border: 1px solid #334155; border-radius: 6px;
        color: #cbd5e1; padding: 0.4rem 0.6rem; font-size: 0.8rem; cursor: pointer;
    }
    .slot-btn:hover, .slot-btn.selected { border-color: #60a5fa; color: #60a5fa; }
    .error-box { background: #2a1418; border: 1px solid #4a1f27; border-radius: 8px; padding: 1rem; color: #f87171; font-size: 0.9rem; }
    details summary { cursor: pointer; color: #94a3b8; font-size: 0.85rem; }

    /* Grade semanal visual da Agenda — eixo de horário + blocos proporcionais */
    .agenda-grid-scroll { display: flex; overflow-x: auto; overflow-y: auto; max-height: 70vh; border: 1px solid #334155; border-radius: 8px; background: #0f172a; }
    .agenda-hour-gutter { flex: 0 0 44px; position: sticky; left: 0; z-index: 3; background: #0f172a; border-right: 1px solid #334155; }
    .agenda-day-col-wrap { flex: 1 1 132px; min-width: 132px; border-right: 1px solid #334155; }
    .agenda-day-col-wrap:last-child { border-right: none; }
    .agenda-day-header { height: 28px; padding: 0.3rem; font-size: 0.78rem; font-weight: 600; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agenda-day-col {
        position: relative;
        box-sizing: border-box;
        /* mantém sincronizado com AGENDA_PX_PER_HOUR (48px) no JS */
        background-image: repeating-linear-gradient(to bottom, #1a2744 0, #1a2744 1px, transparent 1px, transparent 48px);
    }
    .agenda-hour-label { position: absolute; right: 4px; transform: translateY(-50%); font-size: 0.65rem; color: #64748b; white-space: nowrap; }
    .appt-block {
        position: absolute;
        box-sizing: border-box;
        overflow: hidden;
        cursor: pointer;
        border-radius: 6px;
        padding: 2px 4px;
        font-size: 0.68rem;
        line-height: 1.25;
        z-index: 2;
        border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .appt-block--no-top { border-top-left-radius: 0; border-top-right-radius: 0; }
    .appt-block--no-bottom { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .appt-block--confirmed { background: rgba(203, 213, 225, 0.14); color: #e2e8f0; }
    .appt-block--pending { background: rgba(251, 191, 36, 0.18); color: #fbbf24; }
    .agenda-availability-band { position: absolute; left: 0; right: 0; z-index: 1; background: rgba(96, 165, 250, 0.08); pointer-events: none; }
    .agenda-now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid #ef4444; z-index: 5; pointer-events: none; }
    .agenda-now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
</style>
</head>
<body>
<div class="wrap" id="app">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>📅 Minha Agenda</h1>
            <p class="subtitle" id="subtitle">Carregando...</p>
        </div>
        <div class="tabs" id="topTabs" style="display:none;">
            <button class="tab-btn active" id="topTabAgenda" onclick="switchTab('agenda')"><span class="tab-icon">📅</span>Agenda</button>
            <button class="tab-btn" id="topTabAtendimento" onclick="switchTab('atendimento')"><span class="tab-icon">🩺</span>Atendimento</button>
            <button class="tab-btn" id="topTabPacientes" onclick="switchTab('pacientes')"><span class="tab-icon">🗂️</span>Pacientes</button>
            <button class="tab-btn" id="topTabRecibos" onclick="switchTab('recibos')"><span class="tab-icon">🧾</span>Recibos</button>
            <button class="tab-btn" id="topTabConfig" onclick="switchTab('config')"><span class="tab-icon">⚙️</span>Configurações</button>
        </div>
    </aside>
    <main class="main-content">
        <div id="content"></div>
    </main>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token');
const API = window.location.origin + '/whatsapp/api/consultant-portal/' + TOKEN;

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    // innerHTML já escapa &/</>, mas não aspas — precisa disso também pra
    // poder usar esc() dentro de atributos (ex: title="${esc(...)}") sem
    // risco de a string quebrar pra fora do atributo.
    return d.innerHTML.replace(/"/g, '&quot;');
}

function fmtWhen(iso) {
    // iso vem como "YYYY-MM-DDTHH:MM" já em horário local (o backend já converteu)
    const [datePart, timePart] = iso.split('T');
    const [y, m, d] = datePart.split('-');
    const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const dt = new Date(iso);
    return `${days[dt.getDay()]} ${d}/${m} às ${timePart}`;
}

function calcAge(birthDateStr) {
    if (!birthDateStr) return null;
    const [y, m, d] = birthDateStr.split('-').map(Number);
    const today = new Date();
    let age = today.getFullYear() - y;
    if (today.getMonth() + 1 < m || (today.getMonth() + 1 === m && today.getDate() < d)) age--;
    return age;
}

function statusLabel(s) {
    return { confirmed: 'Confirmado', cancelled: 'Cancelado', completed: 'Concluído', no_show: 'Não compareceu', pending_consultant: 'Expirou sem confirmação' }[s] || s;
}

const WEEKDAYS = [['mon','Seg'], ['tue','Ter'], ['wed','Qua'], ['thu','Qui'], ['fri','Sex'], ['sat','Sáb'], ['sun','Dom']];

async function api(path, opts) {
    const res = await fetch(API + path, Object.assign({ headers: {'Content-Type':'application/json'} }, opts || {}));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Erro na requisição');
    return data;
}

let ME = {};

async function init() {
    if (!TOKEN) {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('content').innerHTML = `<div class="error-box">Link inválido. Peça um novo mandando "minha agenda" pelo WhatsApp.</div>`;
        return;
    }
    try {
        const me = await api('/me');
        ME = me;
        document.getElementById('subtitle').textContent = `${me.name} · ${me.account_label}`;
        renderShell(me);
        initNotificationPrefs(me);
        document.getElementById('newTreatmentBlock').style.display = me.booking_mode === 'crm_medico' ? 'block' : 'none';
        await loadAppointments();
        loadContacts();
        loadFichaPatients();
        updateReceiptsCpfWarning();
        loadRecibosList();
        updateAtestadosCpfWarning();
    } catch (e) {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('content').innerHTML = `<div class="error-box">${esc(e.message)}. Peça um novo link mandando "minha agenda" pelo WhatsApp.</div>`;
    }
}

function renderShell(me) {
    const availabilityCard = me.self_availability_enabled === false ? `
        <div class="card">
            <h2>Minha disponibilidade</h2>
            <p class="empty">Sua disponibilidade é definida por ${esc(me.account_label)} — fale com quem administra sua agenda pra ajustar os horários.</p>
        </div>
    ` : `
        <div class="card">
            <h2>Minha disponibilidade</h2>
            <div id="availabilityRows"></div>
            <h3 style="font-size:0.9rem; color:#f8fafc; margin:1.2rem 0 0.5rem;">Datas avulsas <span style="font-weight:normal; color:#64748b; font-size:0.78rem;">(libera um horário fora do padrão semanal, numa data específica)</span></h3>
            <div id="extraDatesRows"></div>
            <div style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin-top:0.5rem;">
                <input type="date" class="form-input" id="newExtraDate" style="flex:1; min-width:140px;">
                <input type="time" class="form-input" id="newExtraStart" value="09:00" style="width:auto;">
                <span style="color:#64748b;">–</span>
                <input type="time" class="form-input" id="newExtraEnd" value="18:00" style="width:auto;">
                <button class="btn btn-sm" onclick="addExtraDate()">+ Adicionar</button>
            </div>
            <button class="btn btn-block" style="margin-top:1.2rem;" onclick="saveAvailability()">Salvar disponibilidade</button>
        </div>
    `;
    document.getElementById('topTabs').style.display = 'flex';
    document.getElementById('content').innerHTML = `
        <div id="agenda-tab" class="tab-content active">
            <div class="card" id="pendingCard" style="display:none;">
                <h2>⏳ Aguardando sua confirmação</h2>
                <p class="empty" style="padding-top:0;">Pedidos feitos pelo cliente direto pelo WhatsApp — o cliente só sabe que está confirmado depois que você aprova aqui.</p>
                <div id="pendingList"></div>
            </div>
            <div class="card">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.8rem; flex-wrap:wrap; gap:0.5rem;">
                    <h2 style="margin:0;">Próximos horários</h2>
                    <div style="display:flex; gap:0.4rem;">
                        <button class="btn btn-sm" id="viewTabList" onclick="switchAgendaView('list')">Lista</button>
                        <button class="btn btn-sm btn-secondary" id="viewTabWeek" onclick="switchAgendaView('week')">Semana</button>
                    </div>
                </div>
                <div id="upcomingList"><p class="empty">Carregando...</p></div>
                <div id="weekView" style="display:none;"></div>
            </div>
            <div class="card">
                <h2>+ Novo agendamento</h2>
                <div class="form-group">
                    <label>Cliente</label>
                    <select class="form-input" id="newContactSelect" onchange="onContactSelectChange()">
                        <option value="">+ Novo contato (digitar telefone)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Telefone do cliente (com DDI)</label>
                    <input class="form-input" id="newPhone" placeholder="5511999999999">
                </div>
                <div class="form-group"><label>Nome (opcional)</label><input class="form-input" id="newName"></div>
                <div class="form-group"><label>Assunto (opcional)</label><input class="form-input" id="newSubject" placeholder="Ex: Revisão de contrato"></div>
                <div id="newTreatmentBlock" style="display:none;">
                    <div class="form-group">
                        <label>Tratamento</label>
                        <select class="form-input" id="newTreatment" onchange="onNewTreatmentChange()">
                            <option value="">+ Novo tratamento</option>
                        </select>
                    </div>
                    <div class="form-group" id="newTreatmentNameGroup">
                        <label>Nome do tratamento (ex: a patologia)</label>
                        <input class="form-input" id="newTreatmentName" placeholder="Ex: Acompanhamento nutricional, Fisioterapia joelho direito...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Data e horário</label>
                    <div style="display:flex; gap:0.5rem;">
                        <input type="date" class="form-input" id="newDate" oninput="updateNewApptDurationSummary()">
                        <input type="time" class="form-input" id="newTime" style="flex:0.7;" oninput="updateNewApptDurationSummary()">
                    </div>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="newLongBlock" onchange="onNewLongBlockChange()"> Preciso de mais tempo (bloco longo, ex: cirurgia, período reservado)</label>
                </div>
                <div id="newLongBlockFields" style="display:none;">
                    <div class="form-group">
                        <label>Término</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="date" class="form-input" id="newEndDate" oninput="updateNewApptDurationSummary()">
                            <input type="time" class="form-input" id="newEndTime" style="flex:0.7;" oninput="updateNewApptDurationSummary()">
                        </div>
                    </div>
                    <p id="newApptDurationSummary" style="color:#94a3b8; font-size:0.82rem; margin:-0.4rem 0 0.8rem;"></p>
                </div>
                <button class="btn btn-block" onclick="createAppointmentManual()">Agendar</button>
                <details style="margin-top:0.9rem;">
                    <summary style="cursor:pointer; color:#94a3b8; font-size:0.85rem;">ou escolher a partir dos horários livres já cadastrados</summary>
                    <div id="newSlots" style="margin-top:0.6rem;"><p class="empty">Toque em "Ver horários" abaixo.</p></div>
                    <button class="btn btn-secondary btn-block" style="margin-top:0.5rem;" onclick="loadNewSlots()">Ver horários livres</button>
                </details>
            </div>
            <div class="card">
                <details>
                    <summary>Histórico recente</summary>
                    <div id="historyList" style="margin-top:0.6rem;"><p class="empty">Carregando...</p></div>
                </details>
            </div>
            <div class="card" id="appointmentDetailCard" style="display:none;">
                <h2><span class="appt-id-badge" id="apptDetailIdBadge"></span> Atendimento completo</h2>
                <p class="empty" id="apptDetailInfo" style="padding-top:0;"></p>
                <div class="form-group"><label>Notas</label><textarea class="form-input" id="apptDetailNotes" rows="3"></textarea></div>
                <div class="form-group"><label>Diagnóstico</label><textarea class="form-input" id="apptDetailDiagnosis" rows="2"></textarea></div>
                <div class="form-group"><label>Prescrição</label><textarea class="form-input" id="apptDetailPrescription" rows="2"></textarea></div>
                <div class="form-group" style="display:flex; gap:0.5rem; flex-wrap:wrap;" id="apptDetailBiometricsFields"></div>
                <button class="btn btn-block" onclick="saveAppointmentDetail()">Salvar alterações</button>
                <button class="btn btn-secondary btn-block" onclick="closeAppointmentDetail()">Fechar</button>
            </div>
            <div class="card" id="rescheduleCard" style="display:none;">
                <h2>Remarcar agendamento</h2>
                <p class="empty" id="rescheduleInfo"></p>
                <div id="rescheduleSlots"></div>
                <button class="btn btn-secondary btn-block" onclick="closeReschedule()">Cancelar</button>
            </div>
        </div>
        <div id="atendimento-tab" class="tab-content">
            <div class="card" id="atendimentoEmptyState">
                <p class="empty" style="padding-top:0;">Nenhum atendimento em andamento. Vá em Agenda e clique em "Iniciar atendimento".</p>
            </div>
            <div class="card" id="consultationCard" style="display:none;">
                <h2>Atendimento</h2>
                <p class="empty" id="consultationInfo" style="padding-top:0;"></p>

                <div class="subtabs">
                    <button class="subtab-btn active" id="consSubTabAtendimento" onclick="switchConsultationSubTab('atendimento')">Atendimento</button>
                    <button class="subtab-btn" id="consSubTabCadastro" onclick="switchConsultationSubTab('cadastro')">Cadastro</button>
                    <button class="subtab-btn" id="consSubTabAgendamentos" onclick="switchConsultationSubTab('agendamentos')">Agendamentos</button>
                    <button class="subtab-btn" id="consSubTabEvolucao" onclick="switchConsultationSubTab('evolucao')">Evolução</button>
                    <button class="subtab-btn" id="consSubTabDocumentos" onclick="switchConsultationSubTab('documentos')">Documentos</button>
                </div>

                <div id="cons-atendimento">
                    <div class="form-group"><label>Detalhes da consulta</label><textarea class="form-input" id="consultationNotes" rows="3"></textarea></div>
                    <div class="form-group"><label>Diagnóstico</label><textarea class="form-input" id="consultationDiagnosis" rows="2"></textarea></div>
                    <div class="form-group"><label>Prescrição</label><textarea class="form-input" id="consultationPrescription" rows="2"></textarea></div>
                    <h3 style="font-size:0.9rem; margin:0.75rem 0 0.4rem;">Sinais vitais</h3>
                    <div class="form-group" style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                        <div style="flex:1 1 100px;"><label>Peso (kg)</label><input type="number" step="0.1" class="form-input" id="bioWeight" oninput="updateBioImc()"></div>
                        <div style="flex:1 1 100px;"><label>Altura (cm)</label><input type="number" step="1" class="form-input" id="bioHeight" oninput="updateBioImc()"></div>
                        <div style="flex:1 1 100px;"><label>IMC</label><input class="form-input" id="bioImc" readonly></div>
                    </div>
                    <div class="form-group" style="display:flex; gap:0.5rem; flex-wrap:wrap;">

}

const WEEKDAY_KEY_SET = new Set(WEEKDAYS.map(([k]) => k));
let extraDates = [];

function renderAvailabilityRows(availability) {
    document.getElementById('availabilityRows').innerHTML = WEEKDAYS.map(([key, label]) => {
        const range = (availability[key] || [])[0];
        return `
        <div class="day-row">
            <label><input type="checkbox" id="avail_${key}_on" ${range ? 'checked' : ''}> ${label}</label>
            <input type="time" class="form-input" id="avail_${key}_start" value="${range ? range[0] : '09:00'}">
            <span style="color:#64748b;">–</span>
            <input type="time" class="form-input" id="avail_${key}_end" value="${range ? range[1] : '18:00'}">
        </div>`;
    }).join('');

    extraDates = [];
    Object.keys(availability).forEach(key => {
        if (WEEKDAY_KEY_SET.has(key)) return;
        (availability[key] || []).forEach(([start, end]) => extraDates.push({ date: key, start, end }));
    });
    extraDates.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
    renderExtraDatesRows();
}

function fmtExtraDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
}

function renderExtraDatesRows() {
    document.getElementById('extraDatesRows').innerHTML = !extraDates.length
        ? '<p class="empty" style="padding:0.2rem 0;">Nenhuma data avulsa cadastrada.</p>'
        : extraDates.map((d, i) => `
            <div class="day-row">
                <span style="flex:1; font-size:0.85rem; color:#cbd5e1;">${fmtExtraDate(d.date)} · ${d.start}–${d.end}</span>
                <button class="btn btn-sm btn-danger" onclick="removeExtraDate(${i})">Remover</button>
            </div>
        `).join('');
}

function addExtraDate() {
    const date = document.getElementById('newExtraDate').value;
    const start = document.getElementById('newExtraStart').value;
    const end = document.getElementById('newExtraEnd').value;
    if (!date) return alert('Escolha uma data.');
    if (start >= end) return alert('Horário de início precisa ser antes do fim.');
    extraDates.push({ date, start, end });
    extraDates.sort((a, b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
    document.getElementById('newExtraDate').value = '';
    renderExtraDatesRows();
}

function removeExtraDate(index) {
    extraDates.splice(index, 1);
    renderExtraDatesRows();
}

async function saveAvailability() {
    const weekly_availability = {};
    WEEKDAYS.forEach(([key]) => {
        if (document.getElementById(`avail_${key}_on`).checked) {
            weekly_availability[key] = [[document.getElementById(`avail_${key}_start`).value, document.getElementById(`avail_${key}_end`).value]];
        }
    });
    extraDates.forEach(d => {
        if (!weekly_availability[d.date]) weekly_availability[d.date] = [];
        weekly_availability[d.date].push([d.start, d.end]);
    });
    try {
        await api('/availability', { method: 'PATCH', body: JSON.stringify({ weekly_availability }) });
        alert('Disponibilidade salva!');
    } catch (e) { alert(e.message); }
}

let lastUpcoming = [];
let lastHistory = [];

async function loadAppointments() {
    const data = await api('/appointments');
    lastUpcoming = [...data.pending, ...data.upcoming];
    lastHistory = data.history;

    const pendingCard = document.getElementById('pendingCard');
    const pendingEl = document.getElementById('pendingList');
    if (!data.pending.length) {
        pendingCard.style.display = 'none';
    } else {
        pendingCard.style.display = 'block';
        pendingEl.innerHTML = data.pending.map(a => `
            <div class="appt-row">
                <div class="appt-info">
                    <div class="name">${esc(a.client_name || a.client_wa_id)}</div>
                    <div class="when">${fmtWhen(a.scheduled_at)}</div>
                    ${a.subject ? `<div class="when">${esc(a.subject)}</div>` : ''}
                </div>
                <div class="appt-actions">
                    <button class="btn btn-sm" onclick="confirmAppt(${a.id})">Confirmar</button>
                    <button class="btn btn-sm btn-danger" onclick="declineAppt(${a.id})">Recusar</button>
                </div>
            </div>
        `).join('');
    }

    const up = document.getElementById('upcomingList');
    up.innerHTML = !data.upcoming.length ? '<p class="empty">Nenhum agendamento futuro.</p>' : data.upcoming.map(a => `
        <div class="appt-row">
            <div class="appt-info">
                <div class="name">${esc(a.client_name || a.client_wa_id)}</div>
                <div class="when">${fmtWhen(a.scheduled_at)}</div>
                ${a.subject ? `<div class="when">${esc(a.subject)}</div>` : ''}
            </div>
            <div class="appt-actions">
                <button class="btn btn-sm" onclick="openConsultation(${a.id}, ${a.client_contact_id}, '${esc(a.client_name || a.client_wa_id).replace(/'/g,"\\'")}', '${a.scheduled_at}')">Iniciar atendimento</button>
                <button class="btn btn-sm btn-secondary" onclick="openReschedule(${a.id}, '${esc(a.client_name || a.client_wa_id).replace(/'/g,"\\'")}')">Remarcar</button>
                <button class="btn btn-sm btn-danger" onclick="cancelAppt(${a.id})">Cancelar</button>
            </div>
        </div>
    `).join('');

    const hist = document.getElementById('historyList');
    hist.innerHTML = !data.history.length ? '<p class="empty">Sem histórico ainda.</p>' : data.history.map(a => `
        <div class="appt-row">
            <div class="appt-info">
                <div class="name"><span class="appt-id-badge">#${a.id}</span> ${esc(a.client_name || a.client_wa_id)} <span class="status-badge status-${a.status}">${statusLabel(a.status)}</span></div>
                <div class="when">${fmtWhen(a.scheduled_at)}</div>
                ${a.subject ? `<div class="when">${esc(a.subject)}</div>` : ''}
            </div>
            <div class="appt-actions">
                <button class="btn btn-sm btn-secondary" onclick="viewAppointmentDetail(${a.id})">Ver completo</button>
            </div>
        </div>
    `).join('');

    if (agendaViewMode === 'week') renderWeekView();
}

async function confirmAppt(id) {
    try {
        await api(`/appointments/${id}/confirm`, { method: 'POST' });
        loadAppointments();
        alert('Agendamento confirmado! O cliente foi avisado por WhatsApp.');
    } catch (e) { alert(e.message); }
}

async function declineAppt(id) {
    if (!confirm('Recusar esse pedido de agendamento? O cliente será avisado e o horário fica livre de novo.')) return;
    try {
        await api(`/appointments/${id}/decline`, { method: 'POST' });
        loadAppointments();
    } catch (e) { alert(e.message); }
}

let agendaViewMode = 'list';
let weekViewOffset = 0;

// Grade semanal visual — constantes de escala (ver .agenda-day-col no CSS,
// o intervalo de 48px do repeating-linear-gradient precisa ficar igual a
// AGENDA_PX_PER_HOUR) e helpers de bloco longo (portados de
// painel-secretaria.html, adaptados pra um único médico — ME em vez de um
// array de consultores).
const AGENDA_PX_PER_HOUR = 48;
const AGENDA_MIN_BLOCK_PX = 20;
const AGENDA_DEFAULT_START_HOUR = 7;
const AGENDA_DEFAULT_END_HOUR = 20;
const AGENDA_WEEKDAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];

function isoDateLocal(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
}

function apptEndAt(a) {
    return new Date(new Date(a.scheduled_at).getTime() + (a.duration_minutes || 0) * 60000);
}

function apptIsLongBlock(a) {
    return a.duration_minutes > (ME.slot_duration_minutes || 0);
}

function fmtShortDate(dateKey) {
    return dateKey.split('-').reverse().slice(0, 2).join('/');
}

function fmtApptDurationSuffix(a) {
    if (!apptIsLongBlock(a)) return '';
    const end = apptEndAt(a);
    const endDateKey = isoDateLocal(end);
    const endTime = `${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')}`;
    const startDateKey = a.scheduled_at.slice(0, 10);
    return endDateKey === startDateKey ? ` até ${endTime}` : ` até ${fmtShortDate(endDateKey)} ${endTime}`;
}

function computeAgendaHourRange(appts) {
    let startHour = AGENDA_DEFAULT_START_HOUR, endHour = AGENDA_DEFAULT_END_HOUR;
    appts.forEach(a => {
        const s = new Date(a.scheduled_at);
        const e = apptEndAt(a);
        startHour = Math.min(startHour, s.getHours());
        endHour = Math.max(endHour, e.getHours() + (e.getMinutes() > 0 ? 1 : 0));
    });
    return { startHour, endHour };
}

function layoutDayColumnItems(items, dayStart, dayEnd) {
    const dayStartMs = dayStart.getTime();
    const dayEndMs = dayEnd.getTime();
    const withSeg = items.map(a => {
        const s = Math.max(new Date(a.scheduled_at).getTime(), dayStartMs);
        const e = Math.min(apptEndAt(a).getTime(), dayEndMs);
        return { a, segStartMin: (s - dayStartMs) / 60000, segEndMin: (e - dayStartMs) / 60000 };
    }).sort((x, y) => x.segStartMin - y.segStartMin);

    const clusters = [];
    let current = [], currentEnd = -Infinity;
    for (const it of withSeg) {
        if (current.length && it.segStartMin >= currentEnd) { clusters.push(current); current = []; currentEnd = -Infinity; }
        current.push(it);
        currentEnd = Math.max(currentEnd, it.segEndMin);
    }
    if (current.length) clusters.push(current);

    clusters.forEach(cluster => {
        const colEnds = [];
        cluster.forEach(it => {
            let col = colEnds.findIndex(end => it.segStartMin >= end);
            if (col === -1) { col = colEnds.length; colEnds.push(it.segEndMin); }
            else colEnds[col] = it.segEndMin;
            it.col = col;
        });
        cluster.forEach(it => it.cols = colEnds.length);
    });
    return withSeg;
}

function getAvailabilityRangesForDay(availability, dateObj) {
    if (!availability) return [];
    const key = AGENDA_WEEKDAY_KEYS[(dateObj.getDay() + 6) % 7];
    const isoKey = isoDateLocal(dateObj);
    return [...(availability[key] || []), ...(availability[isoKey] || [])];
}

function renderAgendaHourGutter(hourRange) {
    const totalHeight = (hourRange.endHour - hourRange.startHour) * AGENDA_PX_PER_HOUR;
    let labels = '';
    for (let h = hourRange.startHour; h <= hourRange.endHour; h++) {
        const top = (h - hourRange.startHour) * AGENDA_PX_PER_HOUR;
        labels += `<div class="agenda-hour-label" style="top:${top}px;">${String(h).padStart(2, '0')}:00</div>`;
    }
    return `<div class="agenda-day-header"></div><div style="position:relative; height:${totalHeight}px;">${labels}</div>`;
}

function renderAgendaDayColumn(i, d, key, dayStart, dayEnd, appts, hourRange, availability, isToday, now, dayNames) {
    const totalHeight = (hourRange.endHour - hourRange.startHour) * AGENDA_PX_PER_HOUR;
    // Bloco longo (ex: cirurgia de vários dias) aparece em toda coluna que
    // ele ocupa, não só no dia de início.
    const items = appts
        .filter(a => new Date(a.scheduled_at) < dayEnd && apptEndAt(a) > dayStart)
        .sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at));
    const laidOut = layoutDayColumnItems(items, dayStart, dayEnd);

    const bandsHtml = availability.map(([startStr, endStr]) => {
        const [sh, sm] = startStr.split(':').map(Number);
        const [eh, em] = endStr.split(':').map(Number);
        const top = ((sh + sm / 60) - hourRange.startHour) * AGENDA_PX_PER_HOUR;
        const height = ((eh + em / 60) - (sh + sm / 60)) * AGENDA_PX_PER_HOUR;
        return `<div class="agenda-availability-band" style="top:${Math.max(0, top)}px; height:${Math.max(0, height)}px;"></div>`;
    }).join('');

    let nowLineHtml = '';
    if (isToday) {
        const nowHour = now.getHours() + now.getMinutes() / 60;
        if (nowHour >= hourRange.startHour && nowHour <= hourRange.endHour) {
            const top = (nowHour - hourRange.startHour) * AGENDA_PX_PER_HOUR;
            nowLineHtml = `<div class="agenda-now-line" style="top:${top}px;"></div>`;
        }
    }

    const blocksHtml = laidOut.map(({ a, segStartMin, segEndMin, col, cols }) => {
        const top = Math.max(0, segStartMin / 60 - hourRange.startHour) * AGENDA_PX_PER_HOUR;
        const height = Math.max(AGENDA_MIN_BLOCK_PX, (segEndMin - segStartMin) / 60 * AGENDA_PX_PER_HOUR);
        const left = (col * 100 / cols) + '%';
        const width = (100 / cols) + '%';
        const startDateKey = a.scheduled_at.slice(0, 10);
        const isContinuationStart = startDateKey !== key;
        const continuesAfter = apptEndAt(a) > dayEnd;
        const isPending = a.status === 'pending_consultant';
        const cls = ['appt-block', isPending ? 'appt-block--pending' : 'appt-block--confirmed'];
        if (isContinuationStart) cls.push('appt-block--no-top');
        if (continuesAfter) cls.push('appt-block--no-bottom');
        const timeLabel = isContinuationStart
            ? `↳ desde ${fmtShortDate(startDateKey)}`
            : `${a.scheduled_at.slice(11, 16)}${fmtApptDurationSuffix(a)}`;
        const showSubject = a.subject && height >= 34;
        const onclick = isPending
            ? `document.getElementById('pendingCard').scrollIntoView({behavior:'smooth'})`
            : `openReschedule(${a.id}, '${esc(a.client_name || a.client_wa_id).replace(/'/g, "\\'")}')`;
        const tooltip = `${a.client_name || a.client_wa_id}${a.subject ? ' · ' + a.subject : ''}`;
        return `
            <div class="${cls.join(' ')}" style="top:${top}px; height:${height}px; left:${left}; width:${width};" title="${esc(tooltip)}" onclick="${onclick}">
                <strong>${timeLabel}</strong> ${isPending ? '⏳ ' : ''}${esc(a.client_name || a.client_wa_id)}
                ${showSubject ? `<div style="opacity:0.75;">${esc(a.subject)}</div>` : ''}
            </div>`;
    }).join('');

    return `
        <div class="agenda-day-col-wrap" style="${isToday ? 'background:rgba(96,165,250,0.05);' : ''}">
            <div class="agenda-day-header" style="color:${isToday ? '#60a5fa' : '#94a3b8'};">${dayNames[i]} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</div>
            <div class="agenda-day-col" style="height:${totalHeight}px;">
                ${bandsHtml}
                ${nowLineHtml}
                ${blocksHtml}
            </div>
        </div>`;
}

function switchAgendaView(mode) {
    agendaViewMode = mode;
    document.getElementById('viewTabList').className = mode === 'list' ? 'btn btn-sm' : 'btn btn-sm btn-secondary';
    document.getElementById('viewTabWeek').className = mode === 'week' ? 'btn btn-sm' : 'btn btn-sm btn-secondary';
    document.getElementById('upcomingList').style.display = mode === 'list' ? '' : 'none';
    document.getElementById('weekView').style.display = mode === 'week' ? '' : 'none';
    if (mode === 'week') renderWeekView();
}

function startOfWeek(offsetWeeks) {
    const now = new Date();
    const day = now.getDay(); // 0=Dom..6=Sáb
    const diffToMonday = (day === 0 ? -6 : 1 - day);
    return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday + offsetWeeks * 7);
}

function changeWeek(delta) {
    weekViewOffset = Math.max(0, weekViewOffset + delta);
    renderWeekView();
}

function renderWeekView() {
    const monday = startOfWeek(weekViewOffset);
    const dayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
    const todayKey = isoDateLocal(new Date());
    const now = new Date();
    const hourRange = computeAgendaHourRange(lastUpcoming);
    // Só existe um médico neste portal — a sombra de disponibilidade
    // aparece sempre (sem o caso "Todos os médicos" do painel da secretária).
    const availabilityBase = ME.weekly_availability || null;

    const cols = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const key = isoDateLocal(d);
        const dayStart = d;
        const dayEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
        const isToday = key === todayKey;
        const availability = availabilityBase ? getAvailabilityRangesForDay(availabilityBase, d) : [];
        cols.push(renderAgendaDayColumn(i, d, key, dayStart, dayEnd, lastUpcoming, hourRange, availability, isToday, now, dayNames));
    }

    document.getElementById('weekView').innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem;">
            <button class="btn btn-sm btn-secondary" onclick="changeWeek(-1)" ${weekViewOffset === 0 ? 'disabled' : ''}>◀ Semana anterior</button>
            <span style="font-size:0.8rem; color:#94a3b8;">${weekViewOffset === 0 ? 'Esta semana' : `Daqui ${weekViewOffset} semana(s)`}</span>
            <button class="btn btn-sm btn-secondary" onclick="changeWeek(1)">Semana seguinte ▶</button>
        </div>
        <div class="agenda-grid-scroll">
            <div class="agenda-hour-gutter">${renderAgendaHourGutter(hourRange)}</div>
            ${cols.join('')}
        </div>
    `;
}

function bioTrendHtml(biometrics, prevBiometrics) {
    if (!biometrics) return '';
    const rows = Object.keys(BIOMETRIC_LABELS)
        .filter(type => biometrics[type] != null)
        .map(type => {
            const { label, unit, decimals } = BIOMETRIC_LABELS[type];
            const cur = Number(biometrics[type]);
            let trend = '';
            if (prevBiometrics && prevBiometrics[type] != null) {
                const prev = Number(prevBiometrics[type]);
                if (cur > prev) trend = ` <span style="color:#f87171;">↑</span> (${prev.toFixed(decimals)} antes)`;
                else if (cur < prev) trend = ` <span style="color:#4ade80;">↓</span> (${prev.toFixed(decimals)} antes)`;
                else trend = ' <span style="color:#94a3b8;">→ igual</span>';
            }
            return `<span style="margin-right:0.75rem;">${label}: ${cur.toFixed(decimals)}${unit}${trend}</span>`;
        });
    if (biometrics.weight_kg != null && biometrics.height_cm != null) {
        const heightM = Number(biometrics.height_cm) / 100;
        rows.push(`<span>IMC: ${(Number(biometrics.weight_kg) / (heightM * heightM)).toFixed(1)}</span>`);
    }
    return rows.length ? `<div style="font-size:0.8rem; color:#94a3b8; margin-top:0.15rem;">${rows.join('')}</div>` : '';

// Linha de agendamento completa (status, assunto, notas/diagnóstico/
// prescrição da consulta, tendência de sinais vitais) — mesmo conteúdo que
// a ficha do paciente mostra no painel da secretária, só que embutido aqui
// pra o médico não precisar sair do fluxo de atendimento pra revisar tudo.
function apptRowFull(a, prev) {
    return `
        <div style="padding:0.5rem 0; border-bottom:1px solid #1a2744;">
            <div style="font-size:0.82rem;">${fmtWhen(a.scheduled_at)}${a.consultant_name ? ' · ' + esc(a.consultant_name) : ''} <span class="status-badge status-${a.status}">${statusLabel(a.status)}</span></div>
            ${a.subject ? `<div style="font-size:0.78rem; color:#94a3b8;">${esc(a.subject)}</div>` : ''}
            ${a.notes ? `<div style="font-size:0.78rem; color:#94a3b8;"><strong>Notas:</strong> ${esc(a.notes)}</div>` : ''}
            ${a.diagnosis ? `<div style="font-size:0.78rem; color:#94a3b8;"><strong>Diagnóstico:</strong> ${esc(a.diagnosis)}</div>` : ''}
            ${a.prescription ? `<div style="font-size:0.78rem; color:#94a3b8;"><strong>Prescrição:</strong> ${esc(a.prescription)}</div>` : ''}
            ${bioTrendHtml(a.biometrics, prev && prev.biometrics)}
        </div>
    `;
}

// Monta o bloco completo (cadastro, agendamentos, evolução, documentos) a
// partir dos 4 endpoints da ficha do paciente — reaproveitado tanto durante
// o atendimento (evolução só leitura, exclui a consulta em andamento das
// listas) quanto na aba Pacientes (evolução com campo de nova nota).
function receiptsListHtml(receipts) {
    if (!receipts.length) return '<p class="empty" style="padding:0.3rem 0;">Nenhum recibo emitido ainda.</p>';
    return receipts.map(r => `
        <div style="padding:0.5rem 0; border-bottom:1px solid #1a2744;">
            <div style="font-size:0.85rem;"><strong>Recibo Nº ${r.id}</strong> ${r.status === 'cancelled' ? '<span style="color:#f87171;">(cancelado)</span>' : ''}</div>
            <div style="font-size:0.78rem; color:#94a3b8;">${esc(r.patient_name)} · ${fmtDateOnly(r.service_date)} · R$ ${Number(r.amount).toFixed(2).replace('.', ',')} · ${esc(r.service_description)}</div>
            ${r.status === 'active' ? `
                <div style="display:flex; gap:0.4rem; margin-top:0.3rem;">
                    <button class="btn btn-sm btn-secondary" onclick="downloadReceipt(${r.id})">Baixar PDF</button>
                    <button class="btn btn-sm btn-secondary" onclick="sendReceipt(${r.id})">Enviar WhatsApp</button>
                    <button class="btn btn-sm btn-danger" onclick="cancelReceipt(${r.id})">Cancelar</button>
                </div>
            ` : ''}
        </div>
    `).join('');
}

function fmtDateOnly(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
}

// Agrupamento pendente/próximos/histórico com tendência de sinais vitais —
// compartilhado entre o box compacto do atendimento e a ficha completa da
// aba Pacientes.
function buildApptHtml(apptData, excludeApptId) {
    const pending = (apptData.pending || []).filter(a => a.id !== excludeApptId);
    const upcoming = (apptData.upcoming || []).filter(a => a.id !== excludeApptId);
    const history = (apptData.history || []).filter(a => a.id !== excludeApptId);

    let apptHtml = '';
    if (pending.length) apptHtml += `<h5 style="font-size:0.78rem; color:#64748b; margin:0.5rem 0 0.2rem;">Aguardando confirmação</h5>` + pending.map(a => apptRowFull(a)).join('');
    if (upcoming.length) apptHtml += `<h5 style="font-size:0.78rem; color:#64748b; margin:0.5rem 0 0.2rem;">Próximos</h5>` + upcoming.map(a => apptRowFull(a)).join('');
    // history vem do mais recente pro mais antigo — a linha anterior de cada
    // item é a próxima do array, usada pra calcular a seta de tendência
    // (↑/↓) de cada sinal vital.
    if (history.length) apptHtml += `<h5 style="font-size:0.78rem; color:#64748b; margin:0.5rem 0 0.2rem;">Histórico</h5>` + history.map((a, i) => apptRowFull(a, history[i + 1])).join('');
    if (!apptHtml) apptHtml = '<p class="empty" style="padding:0.3rem 0;">Nenhum outro agendamento.</p>';
    return apptHtml;
}

function buildEvoHtml(evoData, contactId, editable) {
    const notes = evoData.notes || [];
    const evoListHtml = notes.length
        ? notes.map(n => `
            <div style="padding:0.5rem 0; border-bottom:1px solid #1a2744;">
                <div style="font-size:0.75rem; color:#64748b;">${esc(n.author_label)} · ${fmtDateTime(n.created_at)}</div>
                <div style="font-size:0.82rem; white-space:pre-wrap;">${esc(n.note)}</div>
            </div>`).join('')
        : '<p class="empty" style="padding:0.3rem 0;">Nenhuma nota de evolução ainda.</p>';
    return editable
        ? `
            <textarea class="form-input" id="fichaNewNote" rows="3" placeholder="Registrar evolução..."></textarea>
            <button class="btn btn-sm" style="margin-top:0.5rem;" onclick="addFichaEvolutionNote(${contactId})">Adicionar nota</button>
            <div style="margin-top:0.6rem;">${evoListHtml}</div>
        `
        : evoListHtml;
}

function buildDocsHtml(docsData) {
    const docs = docsData.documents || [];
    return docs.length
        ? docs.map(d => {
            const fileUrl = API + `/patient-documents/${d.id}/file`;
            return `
            <div style="padding:0.4rem 0; border-bottom:1px solid #1a2744; display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                <div>
                    <div style="font-size:0.82rem;">${docTypeLabel(d)} ${d.original_name ? esc(d.original_name) : ''}</div>
                    <div style="font-size:0.75rem; color:#64748b;">${fmtDateTime(d.captured_at)}</div>
                    ${d.caption ? `<div style="font-size:0.78rem; color:#94a3b8;">${esc(d.caption)}</div>` : ''}
                </div>
                ${d.status === 'stored' ? `<a class="btn btn-sm" href="${fileUrl}" target="_blank">Abrir</a>` : ''}
            </div>`;
        }).join('')
        : '<p class="empty" style="padding:0.3rem 0;">Nenhum documento recebido ainda.</p>';
}

// loadConsultationPatientBox mais abaixo, que só preenche o conteúdo de
// cada um a cada consulta aberta.
function switchConsultationSubTab(name) {
    const names = ['atendimento', 'cadastro', 'agendamentos', 'evolucao', 'documentos'];
    for (const n of names) {
        document.getElementById('cons-' + n).style.display = (n === name) ? 'block' : 'none';
        document.getElementById('consSubTab' + n.charAt(0).toUpperCase() + n.slice(1)).classList.toggle('active', n === name);

    ['cons-cadastro', 'cons-agendamentos', 'cons-evolucao', 'cons-documentos']
        .forEach(id => document.getElementById(id).innerHTML = '<p class="empty">Carregando...</p>');

        const [record, apptData, evoData, docsData] = await Promise.all([

            api(`/contacts/${contactId}/evolution-notes`),

function onNewLongBlockChange() {
    const checked = document.getElementById('newLongBlock').checked;
    document.getElementById('newLongBlockFields').style.display = checked ? '' : 'none';
    if (checked) {
        const endDate = document.getElementById('newEndDate');
        const endTime = document.getElementById('newEndTime');
        // Sugestão inicial editável: mesmo dia, 1h depois do início.
        if (!endDate.value) endDate.value = document.getElementById('newDate').value;
        if (!endTime.value) {
            const startTime = document.getElementById('newTime').value;
            if (startTime) {
                const [h, m] = startTime.split(':').map(Number);
                const d = new Date(2000, 0, 1, h, m);
                d.setHours(d.getHours() + 1);
                endTime.value = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            }
        }
    }
    updateNewApptDurationSummary();
}

function newApptDurationMinutes() {
    if (!document.getElementById('newLongBlock').checked) return null;
    const startDate = document.getElementById('newDate').value;
    const startTime = document.getElementById('newTime').value;
    const endDate = document.getElementById('newEndDate').value;
    const endTime = document.getElementById('newEndTime').value;
    if (!startDate || !startTime || !endDate || !endTime) return undefined;
    const startMs = new Date(`${startDate}T${startTime}:00`).getTime();
    const endMs = new Date(`${endDate}T${endTime}:00`).getTime();
    if (!(endMs > startMs)) return NaN;
    return Math.round((endMs - startMs) / 60000);
}

function updateNewApptDurationSummary() {
    if (!document.getElementById('newLongBlock').checked) return;
    const el = document.getElementById('newApptDurationSummary');
    const minutes = newApptDurationMinutes();
    if (minutes === undefined) { el.textContent = ''; return; }
    if (Number.isNaN(minutes)) { el.textContent = 'O término deve ser depois do início.'; el.style.color = '#f87171'; return; }
    el.style.color = '#94a3b8';
    const days = Math.floor(minutes / 1440);
    const hours = Math.floor((minutes % 1440) / 60);
    const mins = minutes % 60;
    const parts = [];
    if (days) parts.push(`${days} dia${days === 1 ? '' : 's'}`);
    if (hours) parts.push(`${hours}h`);
    if (mins) parts.push(`${mins}min`);
    el.textContent = `Duração: ${parts.join(' ') || '0min'}`;
}

async function createAppointment(iso) {
    const phone = document.getElementById('newPhone').value.trim();
    const name = document.getElementById('newName').value.trim();
    const subject = document.getElementById('newSubject').value.trim();
    if (!phone) return alert('Informe o telefone do cliente primeiro.');
    const durationMinutes = newApptDurationMinutes();
    if (durationMinutes === undefined) return alert('Informe a data e hora de término do bloco.');
    if (Number.isNaN(durationMinutes)) return alert('O término do bloco deve ser depois do início.');
    const payload = { phone, name, subject, scheduled_at: iso };
    if (durationMinutes !== null) payload.duration_minutes = durationMinutes;
    if (ME.booking_mode === 'crm_medico') {
        const treatmentIdRaw = document.getElementById('newTreatment').value;
        const treatmentName = document.getElementById('newTreatmentName').value.trim();
        if (!treatmentIdRaw && !treatmentName) return alert('Escolha um tratamento existente ou informe o nome do tratamento novo (ex: a patologia).');
        if (treatmentIdRaw) payload.treatment_id = Number(treatmentIdRaw);
        else payload.treatment_name = treatmentName;
    }
    try {
        await api('/appointments', { method: 'POST', body: JSON.stringify(payload) });
        document.getElementById('newContactSelect').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newPhone').readOnly = false;
        document.getElementById('newName').value = '';
        document.getElementById('newSubject').value = '';
        document.getElementById('newDate').value = '';
        document.getElementById('newTime').value = '';
        document.getElementById('newTreatmentName').value = '';
        document.getElementById('newLongBlock').checked = false;
        document.getElementById('newEndDate').value = '';
        document.getElementById('newEndTime').value = '';
        document.getElementById('newLongBlockFields').style.display = 'none';
        document.getElementById('newApptDurationSummary').textContent = '';
        loadNewTreatments(null);
        document.getElementById('newSlots').innerHTML = '<p class="empty">Toque em "Ver horários" abaixo.</p>';
        loadAppointments();
        alert('Agendamento criado! O cliente foi avisado por WhatsApp.');
    } catch (e) { alert(e.message); }
}

function createAppointmentManual() {
    // Pontual: agenda exatamente a data/horário digitado, sem depender da
    // disponibilidade cadastrada — o backend só confere conflito com outros
    // agendamentos confirmados (_create_appointment_if_free), não exige que
    // o horário esteja pré-liberado em weekly_availability.
    const date = document.getElementById('newDate').value;
    const time = document.getElementById('newTime').value;
    if (!date || !time) return alert('Escolha a data e o horário.');
    createAppointment(`${date}T${time}:00`);
}

function onReciboAppointmentChange() {
    const sel = document.getElementById('reciboAppointment');
    const opt = sel.selectedOptions[0];
    if (!opt || !opt.value) return;
    document.getElementById('reciboDate').value = opt.dataset.date || '';
    document.getElementById('reciboService').value = opt.dataset.subject || '';
}

function emitReceiptForContact(contactId) {
    switchTab('recibos');
    toggleNewReciboForm(true);
    document.getElementById('reciboPatient').value = contactId;
    onReciboPatientChange();
}

async function createRecibo() {
    const contactId = document.getElementById('reciboPatient').value;
    const appointmentId = document.getElementById('reciboAppointment').value;
    const serviceDate = document.getElementById('reciboDate').value;
    const amount = document.getElementById('reciboAmount').value;
    const serviceDescription = document.getElementById('reciboService').value.trim();
    if (!contactId) return alert('Selecione o paciente.');
    if (!serviceDate) return alert('Informe a data do serviço.');
    if (!amount || Number(amount) <= 0) return alert('Informe um valor válido.');
    if (!serviceDescription) return alert('Descreva o serviço prestado.');
    try {
        await api(`/contacts/${contactId}/receipts`, {
            method: 'POST',
            body: JSON.stringify({
                service_description: serviceDescription, amount: Number(amount),
                service_date: serviceDate, appointment_id: appointmentId ? Number(appointmentId) : null,
            }),
        });
        toggleNewReciboForm(false);
        loadRecibosList();
        if (document.getElementById('fichaPatientSelect').value === contactId) loadFichaPatient();
    } catch (e) { alert(e.message); }
}

async function loadRecibosList() {
    const patientId = document.getElementById('recibosFilterPatient').value;
    const year = document.getElementById('recibosFilterYear').value;
    const params = new URLSearchParams();
    if (patientId) params.set('contact_id', patientId);
    if (year) params.set('year', year);
    const el = document.getElementById('recibosList');
    el.innerHTML = '<p class="empty">Carregando...</p>';
    try {
        const data = await api(`/receipts?${params.toString()}`);
        el.innerHTML = receiptsListHtml(data.receipts || []);
    } catch (e) {
        el.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    }
}

async function downloadReceipt(id) {
    try {
        const blob = await apiBlob(`/receipts/${id}/pdf`);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `recibo-${id}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
}

async function sendReceipt(id) {
    if (!confirm('Enviar este recibo em PDF pelo WhatsApp do paciente?')) return;
    try {
        await api(`/receipts/${id}/send-whatsapp`, { method: 'POST' });
        alert('Recibo enviado!');
    } catch (e) { alert(e.message); }
}

async function cancelReceipt(id) {
    const reason = prompt('Motivo do cancelamento (opcional):') || '';
    if (!confirm('Cancelar este recibo? Ele deixa de poder ser baixado/enviado, mas continua no histórico.')) return;
    try {
        await api(`/receipts/${id}/cancel`, { method: 'POST', body: JSON.stringify({ reason }) });
        loadRecibosList();
        if (document.getElementById('fichaPatientSelect').value) loadFichaPatient();
    } catch (e) { alert(e.message); }
}

async function downloadAnnualStatement() {
    const contactId = document.getElementById('statementPatient').value;
    const year = document.getElementById('statementYear').value;
    if (!contactId || !year) return alert('Selecione paciente e ano.');
    const isAll = contactId === 'all';
    try {
        const blob = await apiBlob(isAll ? `/annual-statement/all?year=${year}` : `/contacts/${contactId}/annual-statement?year=${year}`);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = isAll ? `declaracoes-ir-${year}.zip` : `declaracao-ir-${year}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
}

async function sendAnnualStatement() {
    const contactId = document.getElementById('statementPatient').value;
    const year = document.getElementById('statementYear').value;
    if (!contactId || !year) return alert('Selecione paciente e ano.');
    if (contactId === 'all') {
        if (!confirm('Enviar a declaração anual em PDF pelo WhatsApp de TODOS os seus pacientes neste ano?')) return;
        try {
            const data = await api(`/annual-statement/all/send-whatsapp`, { method: 'POST', body: JSON.stringify({ year: Number(year) }) });
            alert(`${data.sent} declaração(ões) enviada(s)${data.failed ? `, ${data.failed} falharam` : ''}.`);
        } catch (e) { alert(e.message); }
        return;
    }
    if (!confirm('Enviar a declaração anual em PDF pelo WhatsApp do paciente?')) return;
    try {
        await api(`/contacts/${contactId}/annual-statement/send-whatsapp`, { method: 'POST', body: JSON.stringify({ year: Number(year) }) });
        alert('Declaração enviada!');
    } catch (e) { alert(e.message); }
}

// ---- Atestados ----
function updateAtestadosCpfWarning() {
    const box = document.getElementById('atestadosCpfWarning');
    if (!box) return;
    const missing = !ME.cpf || !ME.crm;
    box.style.display = missing ? 'block' : 'none';
    box.textContent = missing ? 'Complete seu CPF e CRM na aba Configurações antes de emitir atestados.' : '';
    document.getElementById('newAtestadoToggleBtn').disabled = missing;
}

function toggleNewAtestadoForm(show) {
    const box = document.getElementById('newAtestadoForm');
    const visible = show !== undefined ? show : box.style.display === 'none';
    box.style.display = visible ? 'block' : 'none';
    if (visible) {
        document.getElementById('atestadoTreatment').innerHTML = '<option value="">Nenhum</option>';
        document.getElementById('atestadoAppointment').innerHTML = '<option value="">Nenhum (avulso)</option>';
        document.getElementById('atestadoReason').value = '';
        document.getElementById('atestadoStartDate').value = '';
        document.getElementById('atestadoEndDate').value = '';
        document.getElementById('atestadoCidCode').value = '';
        document.getElementById('atestadoCidDescription').value = '';
        document.getElementById('atestadoCidAuthorized').checked = false;
        loadAtestadoFormOptionsForFicha();
    }
}

// Paciente é sempre o da ficha aberta (sem select próprio no formulário,
// diferente da versão antiga que vivia numa aba de nível superior).
async function loadAtestadoFormOptionsForFicha() {
    const contactId = document.getElementById('fichaPatientSelect').value;
    const apptSel = document.getElementById('atestadoAppointment');
    const treatSel = document.getElementById('atestadoTreatment');
    apptSel.innerHTML = '<option value="">Nenhum (avulso)</option>';
    treatSel.innerHTML = '<option value="">Nenhum</option>';
    if (!contactId) return;
    try {
        const apptData = await api(`/contacts/${contactId}/appointments`);
        const completed = (apptData.history || []).filter(a => a.status === 'completed');
        apptSel.innerHTML += completed.map(a => `<option value="${a.id}" data-date="${(a.scheduled_at || '').split('T')[0]}" data-subject="${esc(a.subject || '')}">${fmtWhen(a.scheduled_at)}${a.subject ? ' — ' + esc(a.subject) : ''}</option>`).join('');
    } catch (e) { /* select fica só com "avulso" */ }
    try {
        const treatData = await api(`/contacts/${contactId}/treatments`);
        treatSel.innerHTML += (treatData.treatments || []).map(t => `<option value="${t.id}">${esc(t.name || 'Tratamento')}${t.status !== 'active' ? ' (concluído)' : ''}</option>`).join('');
    } catch (e) { /* select fica só com "nenhum" */ }
}

function onAtestadoAppointmentChange() {
    const sel = document.getElementById('atestadoAppointment');
    const opt = sel.selectedOptions[0];
    if (!opt || !opt.value) return;
    document.getElementById('atestadoStartDate').value = opt.dataset.date || '';
    document.getElementById('atestadoEndDate').value = opt.dataset.date || '';
    if (!document.getElementById('atestadoReason').value.trim()) {
        document.getElementById('atestadoReason').value = opt.dataset.subject || '';
    }
}

async function createAtestado() {
    const contactId = document.getElementById('fichaPatientSelect').value;
    const treatmentId = document.getElementById('atestadoTreatment').value;
    const appointmentId = document.getElementById('atestadoAppointment').value;
    const reason = document.getElementById('atestadoReason').value.trim();
    const startDate = document.getElementById('atestadoStartDate').value;
    const endDate = document.getElementById('atestadoEndDate').value;
    const cidCode = document.getElementById('atestadoCidCode').value.trim();
    const cidDescription = document.getElementById('atestadoCidDescription').value.trim();
    const cidAuthorized = document.getElementById('atestadoCidAuthorized').checked;
    if (!reason) return alert('Descreva o motivo do atestado.');
    if (!startDate || !endDate) return alert('Informe o período de afastamento (início e fim).');
    if (endDate < startDate) return alert('A data de fim não pode ser antes da data de início.');
    try {
        await api(`/contacts/${contactId}/certificates`, {
            method: 'POST',
            body: JSON.stringify({
                treatment_id: treatmentId ? Number(treatmentId) : null,
                appointment_id: appointmentId ? Number(appointmentId) : null,
                reason, leave_start_date: startDate, leave_end_date: endDate,
                cid_code: cidCode, cid_description: cidDescription, cid_authorized_by_patient: cidAuthorized,
            }),
        });
        toggleNewAtestadoForm(false);
        loadFichaPatient(false);
    } catch (e) { alert(e.message); }
}

function fmtAtestadoPeriodo(c) {
    const start = fmtDateOnly(c.leave_start_date);
    const end = fmtDateOnly(c.leave_end_date);
    return start === end ? start : `${start} a ${end}`;
}

function atestadosListHtml(certificates) {
    if (!certificates.length) return '<p class="empty" style="padding:0.3rem 0;">Nenhum atestado emitido ainda.</p>';
    return certificates.map(c => `
        <div style="padding:0.5rem 0; border-bottom:1px solid #1a2744;">
            <div style="font-size:0.85rem;"><strong>Atestado Nº ${c.id}</strong> ${c.status === 'cancelled' ? '<span style="color:#f87171;">(cancelado)</span>' : ''}</div>
            <div style="font-size:0.78rem; color:#94a3b8;">${esc(c.patient_name)} · ${fmtAtestadoPeriodo(c)} · ${esc(c.reason)}${c.cid_code && c.cid_authorized_by_patient ? ` · CID ${esc(c.cid_code)}` : ''}</div>
            ${c.status === 'active' ? `
                <div style="display:flex; gap:0.4rem; margin-top:0.3rem;">
                    <button class="btn btn-sm btn-secondary" onclick="downloadAtestado(${c.id})">Baixar PDF</button>
                    <button class="btn btn-sm btn-secondary" onclick="sendAtestado(${c.id})">Enviar WhatsApp</button>
                    <button class="btn btn-sm btn-danger" onclick="cancelAtestado(${c.id})">Cancelar</button>
                </div>
            ` : ''}
        </div>
    `).join('');
}

async function downloadAtestado(id) {
    try {
        const blob = await apiBlob(`/certificates/${id}/pdf`);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `atestado-${id}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
}

async function sendAtestado(id) {
    if (!confirm('Enviar este atestado em PDF pelo WhatsApp do paciente?')) return;
    try {
        await api(`/certificates/${id}/send-whatsapp`, { method: 'POST' });
        alert('Atestado enviado!');
    } catch (e) { alert(e.message); }
}

async function cancelAtestado(id) {
    const reason = prompt('Motivo do cancelamento (opcional):') || '';
    if (!confirm('Cancelar este atestado? Ele deixa de poder ser baixado/enviado, mas continua no histórico.')) return;
    try {
        await api(`/certificates/${id}/cancel`, { method: 'POST', body: JSON.stringify({ reason }) });
        loadFichaPatient(false);
    } catch (e) { alert(e.message); }
}

init();
</script>
